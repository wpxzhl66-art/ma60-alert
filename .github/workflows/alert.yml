name: 60周线预警

on:
  schedule:
    - cron: "5 2 * * 1-5"     # 北京 10:05 盘中扫描
    - cron: "5 3 * * 1-5"     # 北京 11:05 盘中扫描
    - cron: "5 6 * * 1-5"     # 北京 14:05 盘中扫描
    - cron: "55 6 * * 1-5"    # 北京 14:55 尾盘扫描
    - cron: "15 7 * * 1-5"    # 北京 15:15 收盘确认
    - cron: "7 8 * * 1-5"     # 北京 16:07 数据更新（避开整点负载高峰）
  workflow_dispatch:
    inputs:
      task:
        description: "任务：scan | confirm | update | demo"
        default: "demo"

concurrency:
  group: ma60-alert
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      ALERT_SENDKEY: ${{ secrets.ALERT_SENDKEY }}
      ALERT_CLOUD: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 交易日校验（非交易日自动跳过）
        id: day
        run: |
          cd src
          python -m alert.run_alert --is-trading-day || echo "skip=true" >> "$GITHUB_OUTPUT"

      # ---------------- 盘中扫描 / 收盘确认 ----------------
      - name: 扫描并生成图表
        id: scan
        if: >-
          steps.day.outputs.skip != 'true' &&
          (github.event_name == 'schedule' && github.event.schedule != '7 8 * * 1-5' ||
           github.event.inputs.task == 'scan' || github.event.inputs.task == 'confirm')
        run: |
          cd src
          MODE=intraday
          [ "${{ github.event.inputs.task }}" = "confirm" ] && MODE=confirm
          python -m alert.run_alert --prepare --cloud --mode "$MODE"

      - name: 构建看板数据
        id: dash
        if: steps.scan.conclusion == 'success'
        run: |
          cd src
          python -m dashboard.build --daily

      - name: 提交图表与看板数据
        id: commit
        if: steps.scan.conclusion == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ dashboard/
          git diff --cached --quiet || git commit -m "charts+dashboard $(TZ=Asia/Shanghai date +%F-%H%M)"
          bash .github/scripts/push.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 推送（盘中模式无触发不推送）
        if: steps.scan.conclusion == 'success'
        run: |
          cd src
          python -m alert.run_alert --notify --sha "${{ steps.commit.outputs.sha }}"

      - name: 提交推送状态
        if: steps.scan.conclusion == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/state/
          git diff --cached --quiet || git commit -m "state $(TZ=Asia/Shanghai date +%F-%H%M)"
          bash .github/scripts/push.sh

      # ---------------- 每日数据更新 ----------------
      - name: 更新数据仓
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd src
          python -m alert.run_alert --update-cloud
          python -m dashboard.build --names --weekly

      - name: 清理过期图表（只保留最近 14 个交易日）
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd charts 2>/dev/null || exit 0
          ls -1d */ 2>/dev/null | sort | head -n -14 | while read d; do
            echo "清理 $d"; rm -rf "$d"
          done

      - name: 提交数据仓与看板
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/ dashboard/ charts/
          git diff --cached --quiet || git commit -m "store+dashboard $(TZ=Asia/Shanghai date +%F)"
          bash .github/scripts/push.sh

      # ---------------- 手动演示（不推送） ----------------
      - name: 演示运行
        if: github.event.inputs.task == 'demo'
        run: |
          cd src
          python -m alert.run_alert --prepare --cloud --demo

      - name: 上传演示产物
        if: github.event.inputs.task == 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            output/alert/
            charts/
