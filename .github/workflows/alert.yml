name: 60周线预警

on:
  schedule:
    # 交易时段冗余触发：每 10 分钟一个点，只覆盖有槽位的小时
    # （UTC 02:05–03:55 = 北京 10:05–11:55；UTC 06:05–07:55 = 北京 14:05–15:55，共 24 点）。
    # GitHub 会延迟数小时甚至丢弃 schedule 事件，故用冗余触发点覆盖；
    # .github/scripts/slot_gate.py 再把它们收敛回五个目标槽位
    # 10:05 / 11:05 / 14:05 / 14:55 / 15:15 —— 槽位全部落在网格上，
    # 准点时零延迟命中，事件被丢弃时每个槽位仍有 3 个后续候补点兜底。
    # 非命中点立即退出（约 10 秒），不安装依赖。
    - cron: "5,15,25,35,45,55 2-3,6-7 * * 1-5"
    - cron: "7 8 * * 1-5"     # 北京 16:07 数据更新（避开整点负载高峰）
  workflow_dispatch:
    inputs:
      task:
        description: "任务：scan | confirm | update | demo"
        default: "demo"

concurrency:
  group: ma60-alert
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      ALERT_SENDKEY: ${{ secrets.ALERT_SENDKEY }}
      ALERT_CLOUD: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - name: 槽位闸门（定时触发时收敛到目标扫描时点）
        id: gate
        if: github.event_name == 'schedule' && github.event.schedule != '7 8 * * 1-5'
        run: python3 .github/scripts/slot_gate.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        if: steps.gate.outputs.run != 'false'
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 交易日校验（非交易日自动跳过）
        id: day
        if: steps.gate.outputs.run != 'false'
        run: |
          cd src
          python -m alert.run_alert --is-trading-day || echo "skip=true" >> "$GITHUB_OUTPUT"

      # ---------------- 盘中扫描 / 收盘确认 ----------------
      - name: 扫描并生成图表
        id: scan
        if: >-
          steps.day.outputs.skip != 'true' && steps.gate.outputs.run != 'false' &&
          (github.event_name == 'schedule' && github.event.schedule != '7 8 * * 1-5' ||
           github.event.inputs.task == 'scan' || github.event.inputs.task == 'confirm')
        run: |
          cd src
          MODE=intraday
          [ "${{ github.event.inputs.task }}" = "confirm" ] && MODE=confirm
          python -m alert.run_alert --prepare --cloud --mode "$MODE"

      - name: 构建看板数据
        id: dash
        if: steps.scan.conclusion == 'success'
        run: |
          cd src
          python -m dashboard.build --daily

      - name: 提交图表与看板数据
        id: commit
        if: steps.scan.conclusion == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ dashboard/
          git diff --cached --quiet || git commit -m "charts+dashboard $(TZ=Asia/Shanghai date +%F-%H%M)"
          bash .github/scripts/push.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 推送（盘中模式无触发不推送）
        if: steps.scan.conclusion == 'success'
        run: |
          cd src
          python -m alert.run_alert --notify --sha "${{ steps.commit.outputs.sha }}"

      - name: 标记槽位已执行（扫描成功才标记，失败留给下一个触发点重试）
        if: steps.scan.conclusion == 'success'
        run: python3 .github/scripts/slot_gate.py --mark "${{ steps.gate.outputs.slot }}"

      - name: 提交推送状态
        if: steps.scan.conclusion == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/state/
          git diff --cached --quiet || git commit -m "state $(TZ=Asia/Shanghai date +%F-%H%M)"
          bash .github/scripts/push.sh

      # ---------------- 每日数据更新 ----------------
      - name: 更新数据仓
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd src
          python -m alert.run_alert --update-cloud
          python -m dashboard.build --names --weekly

      - name: 清理过期图表（只保留最近 14 个交易日）
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd charts 2>/dev/null || exit 0
          ls -1d */ 2>/dev/null | sort | head -n -14 | while read d; do
            echo "清理 $d"; rm -rf "$d"
          done

      - name: 提交数据仓与看板
        if: steps.day.outputs.skip != 'true' && (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/ dashboard/ charts/
          git diff --cached --quiet || git commit -m "store+dashboard $(TZ=Asia/Shanghai date +%F)"
          bash .github/scripts/push.sh

      # ---------------- 手动演示（不推送） ----------------
      - name: 演示运行
        if: github.event.inputs.task == 'demo'
        run: |
          cd src
          python -m alert.run_alert --prepare --cloud --demo

      - name: 上传演示产物
        if: github.event.inputs.task == 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            output/alert/
            charts/
