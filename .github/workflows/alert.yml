name: 60周线预警

on:
  schedule:
    # 交易时段冗余触发（2026-10-19 槽位改版 v2）：
    # 目标槽位 09:35 / 10:15 / 13:30 / 14:20 / 15:10（北京时间），
    # 每个槽位放「准点 + 后 10/20 分钟」共 3 个触发点，准点零延迟命中，
    # 事件被丢弃时仍有 2 个后续候补点兜底（slot_gate 窗口 30 分钟收敛）。
    # GitHub 会延迟数小时甚至丢弃 schedule 事件；未命中点立即退出（约 10 秒）。
    # 网格同时覆盖周末（* * *）：周末这些点由 TASK=news 轮处理（非交易日多轮要闻）。
    - cron: "35,45,55 1 * * *"     # 北京 09:35（+09:45 / 09:55）
    - cron: "15,25,35 2 * * *"     # 北京 10:15（+10:25 / 10:35）
    - cron: "30,40,50 5 * * *"     # 北京 13:30（+13:40 / 13:50）
    - cron: "20,30,40 6 * * *"     # 北京 14:20（+14:30 / 14:40）
    - cron: "10,20,30 7 * * *"     # 北京 15:10 收盘确认（+15:20 / 15:30）
    - cron: "7 8 * * 1-5"     # 北京 16:07 数据更新（避开整点负载高峰）
  # 缩进必须与 schedule 同级（2 空格）：缩进到 schedule 列表项内部会让
  # GitHub 只认 schedule，workflow_dispatch 触发器消失（2026-10-17 引入，10-19 修复）。
  workflow_dispatch:
    inputs:
      task:
        description: "任务：scan | confirm | update | news | demo"
        default: "demo"
      force:
        description: "跳过槽位闸门（手动补跑用；外部定时服务不要设）"
        type: boolean
        default: false

concurrency:
  group: ma60-alert
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      ALERT_SENDKEY: ${{ secrets.ALERT_SENDKEY }}
      ALERT_CLOUD: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - name: 轮次闸门（扫描槽位收敛 + 更新幂等 + 多调度源去重）
        id: gate
        # 所有轮次（scan/confirm/update/demo）统一过闸门：
        #  - 扫描轮：收敛到五个槽位，多调度源按「槽位+当日已执行」去重；
        #  - 更新轮：同一交易日只放行一次（外接定时服务接管后与 GitHub cron
        #    双触发，重复跑全市场增量有触发 baostock 黑名单的风险）；
        #  - 演示轮：显式输出 run=na，不依赖「空字符串恰好不等于 false」。
        # 手动补跑用 -f force=true 绕过闸门。
        if: github.event.inputs.force != 'true'
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            SCH="${{ github.event.schedule }}"
            DOW=$(TZ=Asia/Shanghai date +%u)   # 1=周一 … 7=周日
            if [ "$SCH" = "7 8 * * 1-5" ]; then TASK=update
            elif [ "$DOW" -ge 6 ]; then TASK=news   # 周末：非交易日多轮要闻
            else TASK=scan; fi
          fi
          python3 .github/scripts/slot_gate.py --task "$TASK"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        if: steps.gate.outputs.run != 'false'
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 交易日校验（非交易日自动跳过；接口故障必须显式失败）
        id: day
        # BUG #3 修复：正常退出码只有 0（交易日）与 42（非交易日）。
        # 其他非零（网络故障、行情接口异常）不能落进 || 分支被当成
        # 「非交易日」静默跳过全天扫描 —— 必须显式失败，让 run 可见。
        if: steps.gate.outputs.run != 'false'
        run: |
          cd src
          set +e
          python -m alert.run_alert --is-trading-day
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "交易日，继续"
          elif [ "$rc" -eq 42 ]; then
            echo "非交易日，跳过本轮"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "交易日校验异常退出（码 $rc）→ 判为失败中止本轮（不可静默跳过）" >&2
            exit "$rc"
          fi

      # ---------------- 盘中扫描 / 收盘确认 ----------------
      - name: 扫描并生成图表
        id: scan
        if: >-
          steps.day.outputs.skip != 'true' && steps.gate.outputs.run != 'false' &&
          (github.event_name == 'schedule' && github.event.schedule != '7 8 * * 1-5' ||
           github.event.inputs.task == 'scan' || github.event.inputs.task == 'confirm')
        run: |
          cd src
          # 模式按**闸门给出的实际执行时机**定：cron 实测会延迟 8~9 小时，
          # 14:20 的触发晚上才送到时再标「盘中」就是错的（补扫一律按收盘确认处理）。
          MODE="${{ steps.gate.outputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE=intraday
            [ "${{ github.event.inputs.task }}" = "confirm" ] && MODE=confirm
          fi
          echo "扫描模式：$MODE"
          python -m alert.run_alert --prepare --cloud --mode "$MODE"

      - name: 形态扫描（云端版 · 读 store/daily 分片）
        id: pattern
        # 只在收盘确认轮跑：形态本就是收盘后的判断，盘中跑既无意义又白占时间。
        # 失败不阻断主链路（A 股预警优先级更高）——continue-on-error 兜住。
        continue-on-error: true
        if: >-
          steps.scan.conclusion == 'success' &&
          (github.event.inputs.task == 'confirm' || steps.gate.outputs.slot == '15:10')
        run: |
          cd src
          python -m pattern.store_scan --quiet

      - name: 构建看板数据
        id: dash
        if: steps.scan.conclusion == 'success'
        run: |
          cd src
          python -m dashboard.build --daily

      - name: 提交图表与看板数据
        id: commit
        if: steps.scan.conclusion == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ dashboard/
          git diff --cached --quiet || git commit -m "charts+dashboard $(TZ=Asia/Shanghai date +%F-%H%M)"
          bash .github/scripts/push.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 推送（盘中模式无触发不推送）
        if: steps.scan.conclusion == 'success'
        run: |
          cd src
          python -m alert.run_alert --notify --sha "${{ steps.commit.outputs.sha }}"

      - name: 标记槽位已执行（扫描成功才标记，失败留给下一个触发点重试）
        if: steps.scan.conclusion == 'success'
        run: python3 .github/scripts/slot_gate.py --mark "${{ steps.gate.outputs.slot }}"

      - name: 提交推送状态
        if: steps.scan.conclusion == 'success'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/state/
          git diff --cached --quiet || git commit -m "state $(TZ=Asia/Shanghai date +%F-%H%M)"
          bash .github/scripts/push.sh

      # ---------------- 每日数据更新 ----------------
      - name: 更新数据仓（同日幂等：gate 判定，成功后打标）
        if: >-
          steps.day.outputs.skip != 'true' && steps.gate.outputs.run != 'false' &&
          (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd src
          python -m alert.run_alert --update-cloud
          python -m dashboard.build --names --weekly
          # 更新成功才打标（失败留给下一个触发点重试，与扫描槽位同纪律）
          python3 ../.github/scripts/slot_gate.py --mark-update

      - name: 清理过期图表（只保留最近 14 个交易日）
        if: >-
          steps.day.outputs.skip != 'true' && steps.gate.outputs.run != 'false' &&
          (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd charts 2>/dev/null || exit 0
          ls -1d */ 2>/dev/null | sort | head -n -14 | while read d; do
            echo "清理 $d"; rm -rf "$d"
          done

      - name: 提交数据仓与看板
        if: >-
          steps.day.outputs.skip != 'true' && steps.gate.outputs.run != 'false' &&
          (github.event_name == 'schedule' && github.event.schedule == '7 8 * * 1-5' || github.event.inputs.task == 'update')
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/ dashboard/ charts/
          git diff --cached --quiet || git commit -m "store+dashboard $(TZ=Asia/Shanghai date +%F)"
          bash .github/scripts/push.sh

      # ---------------- 非交易日财经要闻（多轮） ----------------
      - name: 非交易日财经要闻（多轮）
        id: offnews
        # 仅在非交易日（周末 / 节假日，由「交易日校验」置 skip=true）运行。
        # 周末与节假日共用五槽位 cron 网格；轮次与「当日已推条目」由
        # store/state/news_marks.json 记录，重复触发不重复占用额度，
        # 每轮只推新增条目（无新增则本轮不推）。
        if: steps.day.outputs.skip == 'true'
        run: |
          cd src
          python -m alert.run_alert --news --cloud

      - name: 提交看板新闻与汇总标记
        if: steps.day.outputs.skip == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/news.json store/state/news_marks.json
          git diff --cached --quiet || git commit -m "news-summary $(TZ=Asia/Shanghai date +%F)"
          bash .github/scripts/push.sh

      # ---------------- 手动演示（不推送） ----------------
      - name: 演示运行
        if: github.event.inputs.task == 'demo'
        run: |
          cd src
          python -m alert.run_alert --prepare --cloud --demo

      - name: 上传演示产物
        if: github.event.inputs.task == 'demo'
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            output/alert/
            charts/
