name: 临时验证 · 推送开关（验证后删除）

# 只读验证：在 GitHub runner 上确认 push.enabled=false 真的被读到，
# 并且 pusher.send() 会早退——**不会发出任何真实推送**（send 在早退路径上
# 根本走不到 HTTP 请求）。跑完即删。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: 云端读开关
        run: |
          cd src
          python - <<'PY'
          import os
          os.environ["ALERT_CLOUD"] = "1"
          from alert import pusher, config
          print("[cloud] push_enabled() =", pusher.push_enabled())
          print("[cloud] 配置 push 段    =", config.load().get("push"))
          print("[cloud] state_dir       =", config.state_dir())
          # 早退路径：返回 False 且不产生任何 HTTP 请求
          sent = pusher.send("验证用标题（不应发出）", "验证用正文")
          print("[cloud] send() 返回      =", sent)
          print("[cloud] 今日额度计数     =", pusher._today_count())
          assert pusher.push_enabled() is False, "开关没生效！"
          assert sent is False, "send 竟然返回成功！"
          print("[cloud] OK 推送已停用且未发出任何请求")
          PY
