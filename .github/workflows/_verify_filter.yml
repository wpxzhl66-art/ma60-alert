name: 临时验证·云端筛除链路

# 验证两件事（验证通过后本文件即删除）：
#   1) GitHub runner（境外）能否访问东财数据中心 —— 取不到就说明云端筛除会降级，
#      必须改为「本机算好落库」的架构；
#   2) pattern.store_scan 在云端带上 filters 后能否跑通。
# 只读：不提交、不推送。

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 东财接口连通性（解禁 + 公告）
        run: |
          cd src
          python - <<'PY'
          from datetime import date
          from pattern import filters as pf
          today = date.today().isoformat()
          print("云端日期:", today)
          try:
              lift = pf.fetch_lift(["600000", "000001", "688469"], today)
              print("OK 解禁接口 · 命中", {k: len(v) for k, v in lift.items()} or "无")
          except Exception as e:
              print("FAIL 解禁接口:", type(e).__name__, e)
          try:
              news = pf.fetch_news(["600000", "002058"], today)
              print("OK 公告接口 · 条数", {k: len(v) for k, v in news.items()} or "无")
          except Exception as e:
              print("FAIL 公告接口:", type(e).__name__, e)
          PY

      - name: 形态扫描（含筛除，只读）
        run: |
          cd src
          python -m pattern.store_scan --no-build
