name: 定时探针

# 临时排查用：验证 GitHub 在本仓库的 schedule 触发是否整体可用。
# 每 5 分钟触发一次，只打印时间，不碰任何数据。
# 结论得出后应立即删除本文件。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 打印触发信息
        run: |
          echo "事件: ${{ github.event_name }}"
          echo "cron: ${{ github.event.schedule }}"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%F %H:%M:%S')"
          echo "UTC: $(date -u '+%F %H:%M:%S')"
