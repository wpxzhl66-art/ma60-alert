# 实时预警系统配置
serverchan:
  sendkey: ""               # 密钥不入库：本地放 alert_config.local.yaml，云端放 Secrets
  daily_limit: 5            # Server酱免费额度（条/天），超出则记录并跳过

scan:
  intraday_times: ["10:05", "11:05", "14:05", "14:55"]   # 盘中扫描（HH:MM）
  close_confirm: "15:15"     # 收盘确认批
  daily_update: "16:00"      # 日线增量更新 + 快照重建

events:
  type: "A"                  # 只推 A 类上穿
  strict: true               # 严格口径：现价 >= MA60 即触发
  dedup_weekly: true         # 同一股票同一自然周内只推首次

push:
  # 总开关：true = 按定时任务正常发送；false = 只扫描与更新，不发送。
  # 覆盖 A 股、期货、右侧反转形态三个板块（它们共用同一条消息）。
  enabled: true
  max_stocks_per_msg: 30     # 单条消息最多列出的股票数
  include_backtest: true     # 附回测参照

jump:
  scheme: "hexin://stock/{code6}"                     # 实测无法唤起，已弃用
  web: "https://stockpage.10jqka.com.cn/{code6}/"     # 同花顺个股页（手动切周K）
  # 周K图公网地址：填 https://cdn.jsdelivr.net/gh/<你的用户名>/<仓库名>
  # 保留 USER/REPO 占位符时图表功能自动关闭
  chart_base_url: "https://cdn.jsdelivr.net/gh/wpxzhl66-art/ma60-alert"

mktcap_buckets:              # 流通市值档位（亿元，静态口径）
  small_max: 200
  large_min: 800

# 期货板块：国内 82 个品种的「持仓量加权指数」60 周线预警
# 加权口径 Σ(收盘×持仓量)/Σ(持仓量)，与文华/东财「XX加权」同源，无换月跳空
futures:
  enabled: true
  near_pct: 0.03             # 「临近」判定：加权价与 60 周线偏离在 ±3% 以内
  push: true                 # 期货触发是否推送（与 A 股共用 Server酱每日额度）
  push_near_max: 5           # 单条消息最多列出的「临近」品种数（突破不限）
  dedup_weekly: true         # 同一品种同一自然周只推首次

# 重要财经新闻栏目（v1.21.0）：采集同花顺 / 金十数据 / 新浪财经，
# 统一为「发布时间 · 来源 · 标题 · 摘要 · 原文链接」，按重要性与时间排序，
# 高度相似的同一事件合并成一条（保留最早发布时间并标出所有来源）。
# 任一源失败只在栏目内给出提示，**不会中断推送**；全部失败时栏目留空并说明。
news:
  enabled: true              # false = 不采集、不占推送篇幅
  sources:                   # 逐个开关：把某个源设为 false 即可停用
    tonghuashun: true        # 同花顺「今日热点」列表页（GBK，解析 HTML 列表）
    jin10: true              # 金十数据快讯接口（部分网络环境不可达 → 自动降级）
    sina: true               # 新浪财经滚动新闻（roll feed，JSON）
  window_hours: 24           # 只保留最近 N 小时内发布的新闻
  per_source: 25             # 每个源最多抓多少条原始新闻
  max_items: 8               # 栏目最终输出条数
  max_per_source: 5          # 同一来源最多占几条（避免单源刷屏）；0 = 不限制
  sim_threshold: 0.62        # 标题相似度 ≥ 此值判为同一事件（合并）
  timeout: 12                # 单个源的网络超时（秒）
  sina_lid: 2516             # 新浪滚动频道：2516=全球财经，153=财经头条等可换
  section_title: "重要财经新闻"
  push_alone: false          # 仅当有新闻、而 A股/期货/形态都无内容时，
                             # 是否单独推一条（true 时**只在收盘确认轮**生效，
                             # 避免盘中 4 个扫描槽把每日 5 条额度占满）
