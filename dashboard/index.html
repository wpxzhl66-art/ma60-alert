<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>60周线预警台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <h1>60周线预警台</h1>
      <div class="sub" id="subTitle">正在加载…</div>
    </div>
    <span class="pill off" id="dayPill"><i class="dot"></i><span>—</span></span>
    <span class="ver" id="verBadge" title="看板版本">v1.6.0</span>
  </div>
</header>

<main class="wrap">

  <!-- ==================== 今日 ==================== -->
  <section class="tabpane on" id="pane-today">
    <div class="card" id="todayHero">
      <div class="loading"><span class="spinner"></span></div>
    </div>

    <div class="card" id="histCard" style="display:none">
      <div class="card-body hist-link" id="histBox" style="padding:13px 16px"></div>
    </div>

    <div class="section-label">今日触发明细</div>
    <div class="card">
      <div class="card-head">
        <h2>触及 60 周线的 A 股</h2>
        <div class="hint" id="trigHint">—</div>
      </div>
      <div class="sortbar" id="trigSort"></div>
      <div class="list" id="trigList">
        <div class="loading"><span class="spinner"></span></div>
      </div>
      <div class="note" id="trigNote"></div>
    </div>
  </section>

  <!-- ==================== 期货 ==================== -->
  <section class="tabpane" id="pane-futures">
    <div class="card" id="futHero">
      <div class="loading"><span class="spinner"></span></div>
    </div>

    <div class="section-label">触发品种</div>
    <div class="card">
      <div class="card-head">
        <h2>靠近 60 周线的期货品种加权</h2>
        <div class="hint" id="futHint">—</div>
      </div>
      <div class="sortbar" id="futSort"></div>
      <div class="list" id="futList">
        <div class="loading"><span class="spinner"></span></div>
      </div>
      <div class="note" id="futNote"></div>
    </div>

    <div class="section-label">全部品种</div>
    <div class="card">
      <div class="card-head">
        <h2>各品种加权与 60 周线的距离</h2>
        <div class="hint" id="futAllHint"></div>
      </div>
      <div class="sortbar" id="futAllSort"></div>
      <div class="list" id="futAllList">
        <div class="loading"><span class="spinner"></span></div>
      </div>
      <div class="note" id="futAllNote"></div>
    </div>
  </section>

  <!-- ==================== 运行 ==================== -->
  <section class="tabpane" id="pane-system">
    <div class="section-label">数据资产健康度</div>
    <div class="card">
      <div class="metrics c2" id="healthGrid">
        <div class="loading"><span class="spinner"></span></div>
      </div>
      <div class="note" id="healthNote"></div>
    </div>

    <div class="section-label">推送额度</div>
    <div class="card">
      <div class="card-body" id="quotaBox"></div>
    </div>

    <div class="section-label">每日触发数量趋势</div>
    <div class="card">
      <div class="card-head"><h2>最近 30 个交易日</h2><div class="hint" id="trendHint"></div></div>
      <div id="trendChart" class="chart sm"></div>
      <div class="legend">
        <span><i style="background:#007aff"></i>当日触发数</span>
        <span><i style="background:#ff9500"></i>推送额度上限 5 条/天</span>
      </div>
    </div>

    <div class="section-label">运行流水</div>
    <div class="card">
      <div class="card-head"><h2>最近的云端任务</h2><div class="hint">GitHub Actions</div></div>
      <div class="list" id="runList">
        <div class="loading"><span class="spinner"></span></div>
      </div>
    </div>
  </section>

  <!-- ==================== 账户 ==================== -->
  <section class="tabpane" id="pane-account">
    <div id="authBox">
      <div class="loading"><span class="spinner"></span></div>
    </div>

    <div id="acctBox" style="display:none">
      <div class="section-label">资产总览</div>
      <div class="card">
        <div class="metrics c2" id="assetGrid"></div>
        <div class="card-body" id="acctMeta" style="padding-top:12px"></div>
      </div>

      <div class="section-label">持仓</div>
      <div class="card">
        <div class="card-head">
          <h2>当前持仓</h2>
          <div class="hint" id="posHint">—</div>
        </div>
        <div class="list" id="posList"></div>
        <div class="card-body" style="padding-top:6px">
          <button class="btn block" id="btnTrade">记一笔交易</button>
        </div>
      </div>

      <div class="section-label">绩效</div>
      <div class="card">
        <div class="metrics c2" id="perfGrid"></div>
        <div class="card-head" style="padding-top:14px"><h2>资产曲线</h2><div class="hint" id="equityHint"></div></div>
        <div id="equityChart" class="chart"></div>
        <div class="legend">
          <span><i style="background:#007aff"></i>账户总资产</span>
          <span><i style="background:#8e8e93"></i>沪深300（同起点归一）</span>
        </div>
        <div class="card-head" style="padding-top:4px"><h2>标签复盘</h2><div class="hint">按买入理由分组统计</div></div>
        <div class="list" id="tagList"></div>
      </div>

      <div class="section-label">交易记录</div>
      <div class="card">
        <div class="card-head"><h2>成交流水</h2><div class="hint" id="tradeHint">—</div></div>
        <div class="list" id="tradeList"></div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="hr"></div>
          <div class="btn-row">
            <button class="btn sec" id="btnExport">导出 CSV</button>
            <button class="btn sec" id="btnLogout">退出登录</button>
          </div>
          <div class="note" style="padding:12px 0 0">
            数据存于云端，手机与电脑共用同一本账。
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <div class="inner">
    <button class="on" data-tab="today"><span class="ico">◎</span>今日</button>
    <button data-tab="futures"><span class="ico">◈</span>期货</button>
    <button data-tab="system"><span class="ico">☰</span>运行</button>
    <button data-tab="account"><span class="ico">¥</span>账户</button>
  </div>
</nav>

<!-- ==================== 交易弹层 ==================== -->
<div class="sheet-mask" id="tradeMask">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="tradeTitle">记一笔交易</h3>
      <span class="x" id="tradeClose">✕</span>
    </div>
    <div class="pad">
      <div class="seg" style="margin-bottom:14px">
        <button class="on buy" data-side="buy" id="sideBuy">买入</button>
        <button data-side="sell" id="sideSell">卖出</button>
      </div>

      <div class="field">
        <label>股票（输入代码或名称搜索）</label>
        <input id="fStock" list="stockOptions" placeholder="如 600020 或 中原高速" autocomplete="off">
        <datalist id="stockOptions"></datalist>
      </div>

      <div class="field">
        <label>成交价（元/股）<span class="muted" id="priceHint"></span></label>
        <input id="fPrice" type="number" step="0.001" inputmode="decimal" placeholder="0.000">
      </div>

      <div class="field">
        <label>数量（股，100 的整数倍）</label>
        <input id="fShares" type="number" step="100" inputmode="numeric" placeholder="100">
      </div>

      <div class="field">
        <label>复盘标签</label>
        <select id="fTag">
          <option value="">（不设置）</option>
          <option>上穿突破</option>
          <option>回踩确认</option>
          <option>多头排列</option>
          <option>放量突破</option>
          <option>行业共振</option>
          <option>试仓</option>
          <option>止盈</option>
          <option>止损</option>
        </select>
      </div>

      <div class="field">
        <label>备注</label>
        <input id="fNote" placeholder="一句话记下当时的判断">
      </div>

      <div class="card" style="margin:4px 0 14px">
        <div class="card-body" id="feePreview" style="padding:12px 14px"></div>
      </div>

      <div id="tradeMsg"></div>
      <button class="btn block" id="btnSubmit" style="margin-bottom:8px">确认</button>
      <button class="btn sec block" id="btnCancel">取消</button>
    </div>
  </div>
</div>

<!-- ==================== 图表弹层 ==================== -->
<div class="sheet-mask" id="chartMask">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="chartTitle">周 K</h3>
      <span class="x" id="chartClose">✕</span>
    </div>
    <div id="kChart" class="chart" style="height:330px"></div>
    <div class="pad">
      <div class="card">
        <div class="metrics c3" id="chartStats"></div>
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn buy" id="chartBuy">买入</button>
        <button class="btn sell" id="chartSell">卖出</button>
      </div>
      <div class="note" style="padding:12px 0 0" id="chartNote"></div>
    </div>
  </div>
</div>

<!-- 图表库：优先本地（随站点一起发布，国内可达），失败再退公共 CDN。
     2026-10 实测 cdn.jsdelivr.net 在部分网络下不可达，会导致整页图表初始化失败。 -->
<script src="./vendor/echarts.min.js"
        onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script src="account.js"></script>
</body>
</html>
